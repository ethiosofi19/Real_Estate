<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NestHome Real Estate</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <img src="assets/home.png" alt="NestHome Logo" />
        <p>NestHome Real Estate</p>
      </div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <div class="hamburger">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </nav>

    <section class="hero">
      <div class="hero-content">
        <h1>Find Your Dream Property</h1>
        <p>
          Find villas, townhouses, apartments and more matching your lifestyle.
        </p>

        <div class="search">
          <input type="text" placeholder="Search by city or area..." />
          <select>
            <option value="" disabled selected>Type</option>
            <option value="villa">Villa</option>
            <option value="apartment">Apartment</option>
          </select>
          <select>
            <option value="" disabled selected>Price Range</option>
            <option value="low">Under $3M</option>
            <option value="high">$3M+</option>
          </select>
          <button>
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            Search Properties
          </button>
        </div>
      </div>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
